<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <!-- Họ và tên: Nguyễn Minh Hướng – MSSV: 23103100268 – Banner mẫu 1: xe tải giao hàng -->
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A3D"/><stop offset=".55" stop-color="#F26522"/><stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="thung" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFE4D3"/></linearGradient>
    <linearGradient id="dau" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E3A5F"/><stop offset="1" stop-color="#0F2439"/></linearGradient>
    <linearGradient id="hop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5C28B"/><stop offset="1" stop-color="#D99A5B"/></linearGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#nen)"/>
  <circle cx="1280" cy="120" r="260" fill="#fff" opacity=".08"/>
  <circle cx="1480" cy="560" r="200" fill="#fff" opacity=".06"/>
  <circle cx="120" cy="600" r="180" fill="#000" opacity=".05"/>
