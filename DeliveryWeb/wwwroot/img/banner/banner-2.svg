<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <!-- Họ và tên: Nguyễn Minh Hướng – MSSV: 23103100268 – Banner mẫu 2: thu hộ tiền hàng -->
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173552"/><stop offset=".6" stop-color="#0F2439"/><stop offset="1" stop-color="#0A1A2B"/>
    </linearGradient>
    <linearGradient id="the" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A4C"/><stop offset="1" stop-color="#E4531B"/></linearGradient>
    <linearGradient id="dien" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7ECF3"/></linearGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#nen)"/>
  <circle cx="1250" cy="330" r="300" fill="#F26522" opacity=".12"/>
  <circle cx="1250" cy="330" r="200" fill="#F26522" opacity=".10"/>
  <circle cx="200" cy="80" r="160" fill="#fff" opacity=".04"/>
